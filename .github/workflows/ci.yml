# Fast PR checks (issue #19). Nothing here solves the model: ogcore and oguk
# are not installed, and every job reads the committed results only.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests and results checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: pytest
        run: python -m pytest -q
      - name: Dashboard data files match the generator
        run: python -m uk_growth_with_ai dashboard --check
      - name: check, committed results (common G/Y closure)
        run: python -m uk_growth_with_ai check --results uk_growth_with_ai/data/scenarios.json
      - name: check, committed results (fixed-spending closure)
        run: python -m uk_growth_with_ai check --results uk_growth_with_ai/data/scenarios_fixed_spending.json

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
