[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-growth-with-ai"
version = "0.1.0"
description = "OG-UK scenarios for the UK: a 3.9pp capital-share shift, with and without a 3.1% output gain at fixed inputs (sizes from Korinek et al. 2026)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vahid Ahmadi", email = "vahid@policyengine.org" }]
dependencies = [
    "numpy",
    "pandas",
    "dask[distributed]",
]

# ogcore and oguk are deliberately NOT dependencies: they are installed from
# checkouts (the ramp arms need patches/ogcore-0.17.0-firm-gamma-tv.diff applied
# to ogcore's firm.py), and `report`/`obr` must work without them. solve.py imports them
# lazily at run time.
[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
uk-growth-with-ai = "uk_growth_with_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["uk_growth_with_ai"]

[tool.hatch.build.targets.sdist]
only-include = ["uk_growth_with_ai", "tests", "docs", "patches", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
